name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（tsc + client bundle）
        run: npm run build

      - name: 测试
        run: npm test

      - name: 诊断命令安装入口冒烟
        run: npm run doctor:check

      # lib/ 刻意入库，GitHub/git 安装路径的用户拿到的就是这份产物。
      # 提交前忘了 npm run build 的话，这里会拦下来。
      - name: 校验 lib/ 与提交一致
        run: git diff --exit-code --stat -- lib/

      # git diff 拦不住未跟踪的新产物（新增 src 文件但漏提交其 lib/ 编译产物），
      # 这里用 porcelain 兜底：lib/ 下有任何未跟踪/未暂存改动即失败。
      - name: 校验 lib/ 无未跟踪产物
        run: |
          status=$(git status --porcelain -- lib/)
          if [ -n "$status" ]; then
            echo "lib/ 存在未跟踪或未提交的产物："
            echo "$status"
            exit 1
          fi

      # lib/ 已完成构建与一致性检查；此处禁用生命周期并生成一次真实 tarball。
      # 审核及后续发布都应使用这一份字节流，不重新打包。
      - name: 生成并校验待审核 npm 包
        id: package
        run: node scripts/verify-package.mjs

      - name: 上传待审核 npm 包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-core:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（tsc + client bundle）
        run: npm run build

      - name: 测试
        run: npm test

      - name: 诊断命令安装入口冒烟
        run: npm run doctor:check

      # 直接运行 Node 脚本（不经 npm run），覆盖 Windows 的 npm.cmd 安全拉起分支。
      - name: 校验 npm 包边界（Windows）
        run: node scripts/verify-package.mjs --dry-run
