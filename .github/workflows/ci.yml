name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 发版复用同一批检查，不能只在 Ubuntu 上通过就发布 Windows 用户的安装包。
  workflow_call:
    inputs:
      release_tag:
        description: 手动发布时校验的完整版本标签
        type: string
        required: false
        default: ''

permissions:
  contents: read

# CI 与调用它的 release 使用不同组，避免 reusable workflow 取消自己的调用方。
# tag 验证不因重跑而中断；普通分支/PR 只保留最新一轮。
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.release_tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  # Ubuntu 快速门禁先拦住 workflow 语法、发布说明、锁文件审计与过期构建产物，
  # 通过后立即并行启动 Windows 构建守卫与双平台测试分片，缩短主路径等待时间。
  verify:
    name: verify (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 下载固定版本并核对独立 SHA-256，不通过浮动第三方 action 执行检查。
      - name: 校验 GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-connrefused --connect-timeout 10 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # 先拒绝坏 tag/空发布说明，避免跑完整套测试后才发现不能发版。
      - name: 校验发布元数据
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION"
          node scripts/release-notes.mjs "$VERSION" CHANGELOG.md "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-title.txt"

      - name: 安装依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 宿主版本对齐
        run: npm run host:check

      # 锁文件相同，审计无需在每个系统与分片重复请求 registry。
      - name: 依赖安全审计
        run: npm audit --package-lock-only

      - name: 构建（tsc + client bundle）
        run: npm run build

      # lib/ 刻意入库；两个平台都验证已跟踪差异和遗漏的新产物。
      # 测试分片直接使用这份已验证的 checkout，不再重复构建。
      - name: 校验 lib/ 与 presets/ 完整且未变化
        run: |
          git diff --exit-code --stat -- lib/ presets/
          status=$(git status --porcelain --untracked-files=all -- lib/ presets/)
          if [ -n "$status" ]; then
            echo "lib/ 或 presets/ 存在未跟踪或未提交的产物："
            echo "$status"
            exit 1
          fi

      - name: 诊断命令安装入口冒烟
        run: npm run doctor:check

      - name: 备份恢复安装入口冒烟
        run: npm run backup:check

      # 只打包一次，校验和与发布都使用这份字节流，不再触发 prepack 重建。
      - name: 生成并校验待审核 npm 包
        id: package
        run: node scripts/verify-package.mjs

      - name: 上传待审核 npm 包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0

  # 与测试分片并行执行 Windows 检出重建、CLI 链接与 npm.cmd 打包边界验证，仍为总闸必过项。
  verify-windows:
    name: verify (windows-latest)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: 宿主版本对齐
        run: npm run host:check

      - name: 构建（tsc + client bundle）
        run: npm run build

      - name: 校验 lib/ 与 presets/ 完整且未变化
        run: |
          git diff --exit-code --stat -- lib/ presets/
          status=$(git status --porcelain --untracked-files=all -- lib/ presets/)
          if [ -n "$status" ]; then
            echo "lib/ 或 presets/ 存在未跟踪或未提交的产物："
            echo "$status"
            exit 1
          fi

      - name: 诊断命令安装入口冒烟
        run: npm run doctor:check

      - name: 备份恢复安装入口冒烟
        run: npm run backup:check

      # 直接运行覆盖 Windows 的 npm.cmd 安全拉起分支。
      - name: 校验 npm 包边界（Windows）
        run: node scripts/verify-package.mjs --dry-run

  tests:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/4)
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # 一个分片失败仍收集其它分片，避免一次只看到一个平台的问题。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --prefer-offline --no-audit --no-fund

      # 按双平台实测耗时 LPT 均衡切为四片独立 runner；每台仍 maxWorkers=1，保留 QuickJS 墙钟隔离纪律。
      - name: 测试
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: 测试结果与耗时摘要
        if: ${{ !cancelled() }}
        env:
          TEST_LABEL: ${{ runner.os }} shard ${{ matrix.shard }}/4
        run: node scripts/summarize-tests.mjs .vitest/results.json

      - name: 上传测试报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ runner.os }}-${{ matrix.shard }}
          path: |
            .vitest/results.json
            .vitest/junit.xml
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # 给分支保护一个稳定的总闸；依赖被跳过/取消也不能显示绿灯。
  ci:
    name: CI checks
    if: always()
    needs: [verify, verify-windows, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 所有构建与测试必须成功
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          VERIFY_WINDOWS_RESULT: ${{ needs.verify-windows.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### CI Gate Summary"
              echo ""
              echo "| Stage | Result |"
              echo "| --- | --- |"
              echo "| \`verify (ubuntu-latest)\` | \`$VERIFY_RESULT\` |"
              echo "| \`verify (windows-latest)\` | \`$VERIFY_WINDOWS_RESULT\` |"
              echo "| \`tests (ubuntu + windows, 4 shards each)\` | \`$TEST_RESULT\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$VERIFY_RESULT" = success && test "$VERIFY_WINDOWS_RESULT" = success && test "$TEST_RESULT" = success
