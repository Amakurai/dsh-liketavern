name: release

# 推 v* tag 触发，是本仓库唯一创建 GitHub Release 的地方。
# 分发方式是 GitHub tag + Release 附件里的 tarball（README 的安装命令按 tag 拉取），不走 npm：
# 包名从未在 npm 发布，也没有配置 trusted publishing / NPM_TOKEN，npm publish 只会让发布卡住。
#
# tag 由 scripts/release.mjs 创建（本地已跑过同一批守卫）；这里重跑，防止手工打 tag 或把
# 未构建的 lib/ 发出去：tag 与 package.json 一致、lib/ 与源码同步、全量测试通过、包边界合法、
# CHANGELOG 有非空的本版段。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 附件里的 peer 必须与锁文件、allowScripts 指向同一个宿主版本；这里拒绝版本脱节的 tag。
      - name: 宿主版本对齐
        run: npm run host:check

      # lib/ 刻意入库；发版前必须确认 tarball 里的产物就是从这份源码构建出来的。
      - name: 构建并校验入库产物
        run: |
          npm run build
          git diff --exit-code --stat -- lib/
          status=$(git status --porcelain -- lib/)
          if [ -n "$status" ]; then
            echo "lib/ 与源码不同步（存在未跟踪产物）："
            echo "$status"
            exit 1
          fi

      - name: 测试
        run: npm test

      - name: tag 与 package.json 版本一致
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ]; then
            echo "tag v$VERSION 与 package.json $PKG 不一致" >&2
            exit 1
          fi

      - name: 校验 npm 包边界
        run: npm run package:check

      # 段缺失或为空即失败：宁可不发版，也不发一个没有说明的版本。
      - name: 从 CHANGELOG 生成本版 notes 与标题
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" CHANGELOG.md release-notes.md release-title.txt

      # prepack 会再跑一次构建；tar 包内容由 verify-package 的白名单约束过。
      # 同目录生成 SHA256SUMS.txt，与 README 的完整性校验说明对应。
      - name: 打安装包
        run: |
          npm pack --silent
          ls -l "dsh-liketavern-${GITHUB_REF_NAME#v}.tgz"
          sha256sum "dsh-liketavern-${GITHUB_REF_NAME#v}.tgz" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 幂等：Release 已存在则跳过（registry/Actions 故障后手工补建不会因为重复变红）。
      - name: 建 GitHub Release 并附上 tarball 与校验和
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，跳过。"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$(cat release-title.txt)" \
            --notes-file release-notes.md \
            "dsh-liketavern-${GITHUB_REF_NAME#v}.tgz" \
            SHA256SUMS.txt
