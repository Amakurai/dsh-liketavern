name: release

# 分发走 tag + Release 附件，不走 npm publish。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# 同一 tag 只允许一次发布；不取消已经开始的上传/发布操作。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 只有实际创建 Release 的 job 拿写权限，安装依赖与测试均为只读。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # 仅下载本次 run 的包，不能拿另一提交的成功 CI 来替代 tag 验证。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.sha }}
          path: release-assets

      - name: 校验待发布包并生成说明
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION"
          node scripts/release-notes.mjs "$VERSION" CHANGELOG.md release-notes.md release-title.txt
          cd release-assets
          sha256sum --check "dsh-liketavern-$VERSION.tgz.sha256"
          # 保留 README 对外约定的附件名，内容沿用打包时的原始校验和。
          cp "dsh-liketavern-$VERSION.tgz.sha256" SHA256SUMS.txt

      # 先草稿、后附件、最后发布：上传中断可重跑，避免公开一个缺包的 Release。
      # 已公开的同名 Release 必须逐字节一致，不能因为名字存在就冒充本次成功。
      - name: 发布已验证安装包
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TARBALL="dsh-liketavern-${RELEASE_TAG#v}.tgz"
          if DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$DRAFT" = false ]; then
              mkdir -p "$RUNNER_TEMP/published"
              gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published" --pattern "$TARBALL" --pattern SHA256SUMS.txt
              cmp "release-assets/$TARBALL" "$RUNNER_TEMP/published/$TARBALL"
              cmp release-assets/SHA256SUMS.txt "$RUNNER_TEMP/published/SHA256SUMS.txt"
              echo "已发布附件与本次验证完全一致，跳过。"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$(cat release-title.txt)" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "release-assets/$TARBALL" release-assets/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --title "$(cat release-title.txt)" --notes-file release-notes.md
